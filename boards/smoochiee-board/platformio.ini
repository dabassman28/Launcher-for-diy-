[env:smoochiee-board]
board = esp32s3
build_src_filter =${env.build_src_filter} +<../boards/smoochiee-board>
board_build.arduino.memory_type = qio_opi
board_build.partitions = support_files/custom_16Mb.csv
build_flags =
	${env.build_flags}
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1

	-DDEVICE_NAME='"Bruce Smoochiee v2"'
	-DOTA_TAG='"smoochiee_v2"'

	-D HAS_5_BUTTONS=1
	-DLAUNCHER_GPIO_KEYS='{{"Left", 38}, {"Right", 39}, {"Down", 40}, {"Up", 41}}' # swapped Left/Right

	-D ROTATION=1

	# -DPMIC_BQ25896=1   # removed, no BQ chip

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=4  # ILI9341 (was 1, ST7789)
	-D TFT_WIDTH=240           # was 170
	-D TFT_HEIGHT=320
	-D TFT_BL=6
	-D TFT_RST=16
	-D TFT_DC=15
	-D TFT_MOSI=17
	-D TFT_MISO=8
	-D TFT_SCLK=18
	-D TFT_CS=7

	-D TFT_IPS=0               # was 1
	-D TFT_COL_OFS1=0          # was 35
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0          # was 35
	-D TFT_ROW_OFS2=0

	-D SDCARD_CS=3
	-D SDCARD_SCK=18
	-D SDCARD_MISO=8
	-D SDCARD_MOSI=17


lib_ignore =
	SensorLib
